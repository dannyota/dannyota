<!DOCTYPE html>
<html lang="{{ .Site.Language.Locale }}" class="no-js">
<head>
{{ partial "head.html" . }}
</head>
<body>
<a class="skip" href="#main">skip to content</a>
<div class="crt" aria-hidden="true"></div>
<header class="terminal-chrome" aria-hidden="true">
  <span class="window-dots"><i></i><i></i><i></i></span>
  <span class="terminal-title">danny / readme.md</span>
  <span class="terminal-session">UTF-8</span>
</header>
<main id="main">
{{ block "main" . }}{{ end }}
</main>
<footer class="statusbar">
  <span class="sb-seg"><span class="status-dot" aria-hidden="true"></span> end of file. thanks for stopping by.</span>
  <span class="sb-seg">
    <a href="{{ .Site.Params.github }}" rel="me">github</a>
  </span>
</footer>
{{ $js := resources.Get "js/term.js" | minify | fingerprint "sha384" }}
<script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" crossorigin="anonymous" defer></script>
</body>
</html>

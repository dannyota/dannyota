<!doctype html>
<!--
  Source for static/og.png (1200x630). Render from the repo root:
  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
    --window-size=1200,630 --virtual-time-budget=5000 --screenshot=static/og.png tools/og.html
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;800&display=block" rel="stylesheet">
<style>
  :root {
    --bg: #f7f8f2; --fg: #293d31; --green: #146138; --dim: #526657;
    --amber: #815019; --line: #cbd5c9; --soft: #e3e8dd;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: "JetBrains Mono", monospace;
    padding: 64px 80px 56px;
    display: grid; grid-template-rows: auto 1fr auto; gap: 36px;
  }
  .prompt { font-size: 26px; font-weight: 500; color: var(--green); }
  .prompt .dim { color: var(--dim); font-weight: 400; }
  .prompt .cmd { color: var(--amber); }
  .hero { display: grid; grid-template-columns: 300px 1fr; gap: 56px; align-items: center; }
  .frame {
    width: 300px; height: 300px; border: 2px solid var(--green); border-radius: 10px;
    overflow: hidden; box-shadow: 12px 12px 0 var(--soft);
  }
  .frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
  h1 { font-size: 72px; line-height: 1.05; font-weight: 800; color: var(--green); letter-spacing: -0.02em; }
  .tag { margin-top: 24px; max-width: 32ch; font-size: 28px; line-height: 1.45; }
  .foot {
    display: flex; justify-content: space-between; align-items: baseline;
    border-top: 2px dashed var(--line); padding-top: 22px;
    font-size: 26px; color: var(--dim);
  }
  .foot .url { color: var(--green); font-weight: 800; }
  .cursor { display: inline-block; width: 0.55em; height: 0.16em; background: var(--green); margin-left: 4px; vertical-align: baseline; }
</style>
</head>
<body>
  <p class="prompt">danny@danny.vn<span class="dim">:~$</span> <span class="cmd">whoami</span></p>
  <section class="hero">
    <div class="frame"><img src="../assets/images/danny.jpg" alt=""></div>
    <div>
      <h1>Danny On<br>The Air</h1>
      <p class="tag">Security engineer in Vietnam.<br>I build tools that run security platforms as code.</p>
    </div>
  </section>
  <p class="foot"><span class="url">danny.vn<span class="cursor"></span></span><span>github.com/dannyota</span></p>
</body>
</html>
